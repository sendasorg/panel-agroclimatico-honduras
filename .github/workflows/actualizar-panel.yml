name: Actualizar panel

# FAO publica un dekad cada diez dias, con retraso variable, y ese retraso es el
# problema: con tres fechas fijas al mes, una corrida que caia antes de que FAO
# publicara dejaba el panel parado hasta la siguiente, diez dias despues.
#
# Ahora se mira todos los dias, pero solo se consulta a FAO cuando puede haber
# algo: --solo-si-falta compara el panel en disco contra el ultimo dekad cerrado
# y sale sin tocar la red si ya lo alcanzo. En la practica eso consulta desde el
# dia siguiente al cierre de cada dekad -el 11, el 21 y el 1- hasta que FAO
# publica, y deja de consultar en cuanto llega. Una corrida a mano no lleva la
# compuerta y siempre consulta.
on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      desde:
        description: "Primer dekad a construir (YYYY-MM-Dn). Vacio: sigue desde donde quedo."
        required: false
        type: string
      series:
        description: "Series separadas por comas. Vacio: todas."
        required: false
        type: string
      aceptar_republicacion:
        description: "Sobrescribir dekads que FAO republico"
        required: false
        type: boolean
        default: false
      solo_si_falta:
        description: "Con la compuerta, como la corrida diaria. Para probarla sin esperar al cron."
        required: false
        type: boolean
        default: false

permissions:
  # Un bloque de permisos pone en none todo lo que no se declara: sin
  # issues:write el aviso de republicacion recibe 403 al listar los issues.
  contents: write
  issues: write

concurrency:
  # Dos corridas a la vez se pisarian escribiendo el mismo parquet.
  group: actualizar-panel
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias de construccion
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      # La cache de rasteres no se versiona pero si se reutiliza entre corridas:
      # sin ella cada actualizacion volveria a bajar el historico completo.
      - name: Restaurar cache de rasteres
        uses: actions/cache@v4
        with:
          path: asis_cache
          key: asis-cache-${{ github.run_id }}
          restore-keys: |
            asis-cache-

      - name: Construir
        id: construir
        run: |
          python -m asis.build \
            ${{ (github.event_name == 'schedule' || inputs.solo_si_falta) && '--solo-si-falta' || '' }} \
            ${{ inputs.desde && format('--desde {0}', inputs.desde) || '' }} \
            ${{ inputs.series && format('--series {0}', inputs.series) || '' }} \
            ${{ inputs.aceptar_republicacion && '--aceptar-republicacion' || '' }} \
            2>&1 | tee construccion.log
          echo "salida=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Resumen
        if: always()
        run: |
          {
            echo "### Actualizacion del panel"
            echo '```'
            tail -60 construccion.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Las tablas que Flourish lee por URL salen del panel recien construido y
      # viajan en el mismo commit que los datos de los que salen. Van antes de
      # mirar si data/ cambio, para que cuenten como parte del cambio: si un
      # dekad nuevo mueve la ventana de dieciocho meses, el CSV se mueve con el.
      - name: Tablas para Flourish
        if: steps.construir.outputs.salida == '0'
        run: python scripts/tablas_flourish.py

      # Las pruebas de este workflow no son la CI del codigo -de eso se encarga
      # pruebas.yml en cada push y cada pull request-, sino el blindaje del
      # commit de datos: corren para que un panel que no valida contra el dato
      # oficial de FAO no entre al repo por su propia cuenta. Si el panel no
      # cambio no hay nada que validar ni que commitear, y con el cron diario
      # eso es la mayoria de los dias.
      #
      # Se usa `git status --porcelain` y no `git diff --quiet`: en enero el
      # primer dekad del anio estrena archivo, y un archivo nuevo sin seguir no
      # aparece en un diff. Con diff, ese dia se saltarian las pruebas y el
      # commit, y el anio entrante se perderia en silencio.
      - name: Ver si el panel cambio
        id: cambios
        if: steps.construir.outputs.salida == '0'
        run: |
          if [ -z "$(git status --porcelain -- data/)" ]; then
            echo "hay=no" >> "$GITHUB_OUTPUT"
            echo "data/ sin cambios: no hay nada que validar ni que commitear"
          else
            echo "hay=si" >> "$GITHUB_OUTPUT"
            git status --short -- data/
          fi

      - name: Pruebas
        if: steps.cambios.outputs.hay == 'si'
        run: pytest tests/ -q

      - name: Commitear el panel
        if: steps.cambios.outputs.hay == 'si'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "sin cambios en data/: FAO no publico nada nuevo"
            exit 0
          fi
          ultimo=$(python -c "import json;m=json.load(open('data/manifest.json'));print(max((s['ultimo'] or '') for s in m['series'].values()))")
          git commit -m "datos: panel al dekad ${ultimo}

          Actualizacion automatica desde FAO GIEWS ASIS.
          Generado por .github/workflows/actualizar-panel.yml"
          git push

      # Una republicacion (codigo 3) no se resuelve sola: FAO cambio un dekad ya
      # guardado y alguien tiene que mirarlo antes de sobrescribir una cifra que
      # pudo haberse citado.
      #
      # El codigo es 3 y no 1 a proposito. Python sale con 1 ante cualquier
      # excepcion sin atrapar, asi que mientras la republicacion salia con 1
      # este paso no podia distinguir un diagnostico del constructor de un
      # choque cualquiera. El 21 y el 22 de noviembre de 2026 el servidor de
      # FAO devolvio 502, la construccion murio en la primera llamada de red y
      # este paso abrio un issue anunciando una republicacion que nunca ocurrio,
      # recomendando relanzar con aceptar_republicacion: la unica accion que
      # sobrescribe cifras ya publicadas. Ver asis/build.py, EXIT_REPUBLICACION.
      - name: Avisar de republicacion
        if: steps.construir.outputs.salida == '3'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.readFileSync('construccion.log', 'utf8');
            const detalle = log.split('REPUBLICACION DETECTADA')[1] || log.slice(-3000);
            const cuerpo = [
              'La construccion automatica encontro dekads que FAO republico con',
              'valores distintos a los que ya estaban guardados. No se sobrescribio nada.',
              '',
              'Revise el cambio y, si los valores nuevos son los correctos, vuelva a',
              'lanzar el workflow con `aceptar_republicacion` activado.',
              '',
              '```', detalle.slice(0, 4000), '```',
            ].join('\n');
            const titulo = 'Republicacion de FAO detectada en el panel';
            const abiertas = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'republicacion',
            });
            if (abiertas.data.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: abiertas.data[0].number, body: cuerpo,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: titulo, body: cuerpo, labels: ['republicacion'],
              });
            }

      # Que la fuente no este (codigo 4) no es un fallo del panel y se resuelve
      # esperando. Quien clasifica es el constructor, que tiene en la mano la
      # excepcion que mato la corrida; aqui solo se lee el numero.
      #
      # La primera version de esto buscaba el error con grep en el registro, y
      # eso estaba mal por partida doble. El registro guarda errores ya
      # recuperados -export_tifs atrapa el fallo de un raster, lo imprime y
      # sigue-, asi que un error de red de hace media hora tapaba la causa real
      # de una caida posterior. Y el nombre del servidor no prueba nada: la URL
      # viaja dentro de str(err), de modo que un 400 rechazado aparecia como
      # caida de FAO y el aviso decia que no habia nada que arreglar.
      - name: Avisar que la fuente no respondio
        if: steps.construir.outputs.salida == '4'
        run: |
          {
            echo "### Los servicios de FAO no respondieron"
            echo
            echo "No es un problema del panel: no se descargo ni se escribio"
            echo "nada y los datos versionados siguen intactos. No hay nada que"
            echo "arreglar de este lado; cuando FAO vuelva, la corrida del dia"
            echo "siguiente retoma sola desde donde quedo."
            echo
            echo '```'
            tail -25 construccion.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      # Lo que no es ninguno de los casos anteriores es un fallo propio, y se
      # dice con esas palabras en vez de atribuirselo a nadie.
      - name: Explicar el fallo
        if: steps.construir.outputs.salida != '0' && steps.construir.outputs.salida != '3' && steps.construir.outputs.salida != '4'
        run: |
          {
            echo "### La construccion se cayo por una causa propia"
            echo
            echo "Codigo de salida: \`${{ steps.construir.outputs.salida }}\`."
            echo "No es una republicacion, que seria 3 y abriria un issue con"
            echo "la etiqueta \`republicacion\`, ni una caida de la fuente, que"
            echo "seria 4. Revise el registro: esto si pide un arreglo."
            echo
            echo '```'
            tail -30 construccion.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Fallar si hubo republicacion sin aceptar
        if: steps.construir.outputs.salida == '3'
        run: |
          echo "FAO republico dekads ya guardados y no se sobrescribio nada."
          echo "Mire el issue con la etiqueta republicacion antes de relanzar"
          echo "con aceptar_republicacion."
          exit 1
